name: yt-diag

on:
  workflow_dispatch:
    inputs:
      video-id:
        description: "YouTube video ID или ссылка"
        required: false
        default: "iG9CE55wbtY"
      languages:
        description: "Коды языков через запятую (пустая строка = любой)"
        required: false
        default: "en"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests youtube-transcript-api

      - name: Run diagnostics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: python yttest.py --video-id "${{ inputs.video-id }}" --languages "${{ inputs.languages }}" --json